<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minecraft-ish 3D Demo</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background: #87ceeb;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
    }
    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 10px 14px;
      background: rgba(0,0,0,0.35);
      color: white;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      user-select: none;
      pointer-events: none;
    }
    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 16px;
      height: 16px;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    #crosshair::before, #crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.9);
    }
    #crosshair::before {
      left: 50%;
      top: -1px;
      width: 2px;
      height: 18px;
      transform: translateX(-50%);
    }
    #crosshair::after {
      top: 50%;
      left: -1px;
      width: 18px;
      height: 2px;
      transform: translateY(-50%);
    }
  </style>
</head>
<body>
  <div id="hud">
    WASD = move<br>
    SPACE = jump<br>
    MOUSE = look<br>
    LEFT CLICK = place block<br>
    RIGHT CLICK = remove block
  </div>
  <div id="crosshair"></div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 12, 50);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const ambient = new THREE.HemisphereLight(0xffffff, 0x3f3f3f, 1.1);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(10, 18, 8);
    scene.add(sun);

    const world = new Map();
    const blockSize = 1;

    // Simple terrain generation
    function terrainHeight(x, z) {
      return Math.floor(Math.abs(Math.sin(x * 0.7) + Math.cos(z * 0.9)) * 3) + 1;
    }

    function blockKey(x, y, z) {
      return `${x},${y},${z}`;
    }

    function getBlock(x, y, z) {
      return world.get(blockKey(x, y, z));
    }

    function setBlock(x, y, z, color) {
      const key = blockKey(x, y, z);
      if (world.has(key)) {
        const old = world.get(key);
        scene.remove(old.mesh);
        old.mesh.geometry.dispose();
        old.mesh.material.dispose();
      }

      if (color === null) {
        world.delete(key);
        return;
      }

      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(blockSize, blockSize, blockSize),
        new THREE.MeshStandardMaterial({ color })
      );
      mesh.position.set(x, y, z);
      scene.add(mesh);
      world.set(key, { mesh, color });
    }

    function addColumn(x, z) {
      const h = terrainHeight(x, z);
      for (let y = 0; y <= h; y++) {
        let color;
        if (y === h) color = 0x4caf50;      // grass
        else if (y > h - 3) color = 0x7c5a3b; // dirt
        else color = 0x6d6d6d;               // stone

        setBlock(x, y, z, color);
      }

      // Add a few extra random trees
      if ((x * z + x) % 7 === 0 && h > 2) {
        const treeY = h + 1;
        for (let ty = 0; ty < 3; ty++) {
          setBlock(x, treeY + ty, z, 0x8b5a2b); // trunk
        }
        for (let dx = -1; dx <= 1; dx++) {
          for (let dz = -1; dz <= 1; dz++) {
            for (let dy = 0; dy < 2; dy++) {
              setBlock(x + dx, treeY + 2 + dy, z + dz, 0x2e8b57);
            }
          }
        }
      }
    }

    // Generate world
    const WORLD_SIZE = 18;
    for (let x = -WORLD_SIZE; x <= WORLD_SIZE; x++) {
      for (let z = -WORLD_SIZE; z <= WORLD_SIZE; z++) {
        addColumn(x, z);
      }
    }

    // Player
    const player = {
      position: new THREE.Vector3(0, 8, 12),
      velocity: new THREE.Vector3(),
      yaw: 0,
      pitch: -0.4,
      onGround: false
    };

    const keys = {};
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2(0, 0);

    document.addEventListener("keydown", (e) => {
      keys[e.code] = true;
      if (e.code === "KeyP") {
        renderer.domElement.requestPointerLock();
      }
    });

    document.addEventListener("keyup", (e) => {
      keys[e.code] = false;
    });

    document.addEventListener("click", () => {
      if (document.pointerLockElement !== renderer.domElement) {
        renderer.domElement.requestPointerLock();
      }
    });

    document.addEventListener("contextmenu", (e) => e.preventDefault());

    document.addEventListener("mousedown", (e) => {
      if (document.pointerLockElement !== renderer.domElement) return;

      raycaster.setFromCamera(pointer, camera);
      const hit = raycaster.intersectObjects(
        Array.from(world.values()).map(v => v.mesh),
        false
      );

      if (!hit.length) return;

      const target = hit[0].object;
      const pos = target.position.clone();

      if (e.button === 0) {
        // place block in front of the hit face
        const normal = hit[0].face.normal.clone().applyMatrix3(new THREE.Matrix3().getNormalMatrix(target.matrixWorld));
        const placePos = pos.clone().add(normal);
        setBlock(Math.round(placePos.x), Math.round(placePos.y), Math.round(placePos.z), 0x8bc34a);
      } else if (e.button === 2) {
        // remove block
        const block = getBlock(Math.round(pos.x), Math.round(pos.y), Math.round(pos.z));
        if (block) {
          setBlock(Math.round(pos.x), Math.round(pos.y), Math.round(pos.z), null);
        }
      }
    });

    document.addEventListener("mousemove", (e) => {
      if (document.pointerLockElement !== renderer.domElement) return;
      player.yaw -= e.movementX * 0.0022;
      player.pitch -= e.movementY * 0.0022;
      player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch));
    });

    function updateCamera() {
      const yaw = player.yaw;
      const pitch = player.pitch;

      const dir = new THREE.Vector3(
        Math.sin(yaw) * Math.cos(pitch),
        Math.sin(pitch),
        Math.cos(yaw) * Math.cos(pitch)
      ).normalize();

      camera.position.copy(player.position);
      camera.lookAt(player.position.clone().add(dir));
    }

    function tryMove(dx, dz) {
      const speed = 0.13;
      const next = player.position.clone();
      next.x += dx * speed;
      next.z += dz * speed;

      // Simple "no falling through world" check:
      const groundY = Math.round(next.y - 1.5);
      const px = Math.round(next.x);
      const pz = Math.round(next.z);

      if (!getBlock(px, groundY, pz)) {
        player.position.x = next.x;
        player.position.z = next.z;
      }
    }

    function updatePlayer() {
      const moveX = (keys["KeyD"] ? 1 : 0) - (keys["KeyA"] ? 1 : 0);
      const moveZ = (keys["KeyW"] ? 1 : 0) - (keys["KeyS"] ? 1 : 0);

      let forward = new THREE.Vector3(Math.sin(player.yaw), 0, Math.cos(player.yaw));
      let right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));

      const desired = new THREE.Vector3();
      desired.addScaledVector(forward, moveZ);
      desired.addScaledVector(right, moveX);

      if (desired.lengthSq() > 0) {
        desired.normalize();
      }

      tryMove(desired.x, desired.z);

      if (keys["Space"] && player.onGround) {
        player.velocity.y = 0.26;
        player.onGround = false;
      }

      player.velocity.y -= 0.008;
      player.position.y += player.velocity.y;

      const playerBlockX = Math.round(player.position.x);
      const playerBlockY = Math.round(player.position.y - 1.6);
      const playerBlockZ = Math.round(player.position.z);

      if (getBlock(playerBlockX, playerBlockY, playerBlockZ)) {
        player.position.y = Math.ceil(player.position.y) + 0.5;
        player.velocity.y = 0;
        player.onGround = true;
      } else {
        player.onGround = false;
      }

      if (player.position.y < 2) {
        player.position.y = 6;
        player.velocity.y = 0;
      }
    }

    // Ground plane for looks / base world
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({ color: 0x9adf6f, side: THREE.DoubleSide })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1;
    scene.add(floor);

    // Start position
    player.position.set(0, 10, 12);
    updateCamera();

    function animate() {
      requestAnimationFrame(animate);

      updatePlayer();
      updateCamera();

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
